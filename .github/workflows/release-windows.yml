name: Build and release TOMS SLA MB for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m playwright install chromium
      - name: Smoke-test source
        shell: pwsh
        run: python app.py --self-test
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all playwright --name TOMS-SLA-MB app.py
          if (!(Test-Path "dist/TOMS-SLA-MB.exe")) { throw "EXE was not created" }
      - name: Create SHA-256
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/TOMS-SLA-MB.exe").Hash.ToLower()
          Set-Content -LiteralPath "dist/TOMS-SLA-MB.exe.sha256" -Value "$hash  TOMS-SLA-MB.exe" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/TOMS-SLA-MB.exe#TOMS-SLA-MB.exe" "dist/TOMS-SLA-MB.exe.sha256#TOMS-SLA-MB.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "dist/TOMS-SLA-MB.exe#TOMS-SLA-MB.exe" "dist/TOMS-SLA-MB.exe.sha256#TOMS-SLA-MB.exe.sha256" --repo $env:GITHUB_REPOSITORY --title "TOMS SLA MB v$env:VERSION" --generate-notes
          }
