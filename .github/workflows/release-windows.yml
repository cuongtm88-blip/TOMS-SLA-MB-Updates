name: Build and release TOMS SLA MB for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m playwright install chromium
          choco install innosetup --no-progress -y
      - name: Smoke-test source
        shell: pwsh
        run: python app.py --self-test
      - name: Build stable onedir application and installer
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all playwright --name TOMS-SLA-MB app.py
          if (!(Test-Path "dist/TOMS-SLA-MB/TOMS-SLA-MB.exe")) { throw "Application EXE was not created" }
          & "dist/TOMS-SLA-MB/TOMS-SLA-MB.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen import self-test failed" }
          & "dist/TOMS-SLA-MB/TOMS-SLA-MB.exe" --browser-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen Playwright/Chromium self-test failed" }
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DMyAppVersion=$version" installer.iss
          if (!(Test-Path "dist-installer/TOMS-SLA-MB.exe")) { throw "Installer was not created" }
          $testDir = Join-Path $env:RUNNER_TEMP "TOMS-SLA-MB-installed"
          $readyFile = Join-Path $env:RUNNER_TEMP "TOMS-SLA-MB-installer-ready.txt"
          $env:TOMS_UPDATE_READY_FILE = $readyFile
          $install = Start-Process -FilePath "dist-installer/TOMS-SLA-MB.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$testDir","/MERGETASKS=!desktopicon" -PassThru -Wait
          Remove-Item Env:TOMS_UPDATE_READY_FILE
          if ($install.ExitCode -ne 0) { throw "Installer self-test failed with exit code $($install.ExitCode)" }
          if (!(Test-Path $readyFile)) { throw "Installer did not create the readiness signal" }
          & "$testDir/TOMS-SLA-MB.exe" --browser-self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Playwright/Chromium self-test failed" }
      - name: Create SHA-256
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist-installer/TOMS-SLA-MB.exe").Hash.ToLower()
          Set-Content -LiteralPath "dist-installer/TOMS-SLA-MB.exe.sha256" -Value "$hash  TOMS-SLA-MB.exe" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist-installer/TOMS-SLA-MB.exe#TOMS-SLA-MB.exe" "dist-installer/TOMS-SLA-MB.exe.sha256#TOMS-SLA-MB.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "dist-installer/TOMS-SLA-MB.exe#TOMS-SLA-MB.exe" "dist-installer/TOMS-SLA-MB.exe.sha256#TOMS-SLA-MB.exe.sha256" --repo $env:GITHUB_REPOSITORY --title "TOMS SLA MB v$env:VERSION" --generate-notes
          }
